# ---------------------------------------------------------------------------
# Windows round 4: a parity sweep. Each rule is the cmdlet or idiom spelling of
# an action a bash rule BLOCKs on main, on that rule's node and tier, measured
# through the hook (Claude Code Bash vs PowerShell). Destination-aware reading
# does not exist in this vocabulary, so a rule that names Copy-Item or
# Move-Item also fires when the named file is the source; each such rule says
# so. A redirection (`'x' >> file`) is not a command's element, so no rule
