# Piped bulk delete. Twin: the built-in sem-block-find-delete (find on a
# system path with -delete or -exec), BLOCK in every install, with or without
# -f. PowerShell's spelling of find … -delete is Get-ChildItem piped into
# Remove-Item; the rule reads the Get-ChildItem that feeds it.
# ---------------------------------------------------------------------------
- id: ps-block-remove-piped-system
  taxonomy: destructive-ops/fs-destruction/system-directory-delete
  match:
    powershell:
      command: remove-item
      fed_by_any:
      - command: get-childitem
        paths_any: ['?:/', '?:/\*', '/\*', '?:/Windows/**', '?:/Program Files/**', '?:/Program Files (x86)/**', '?:/ProgramData']
      - command: get-childitem
        args_any: ['/', '\']
  decision: BLOCK
  confidence: 0.9
  reason: >-
    Get-ChildItem on a drive root or a Windows system directory (C:\Windows
    and below, Program Files) piped into Remove-Item deletes what it lists:
    the PowerShell spelling of find / -delete or find /etc -delete.
  tests:
    tp:
    - 'Get-ChildItem C:\Windows -Recurse | Remove-Item -Force'
    - 'Get-ChildItem C:\ -Recurse -Include *.dll | Remove-Item -Force'
    - 'gci C:\Windows\System32 -Filter *.dll | ri -fo'
    - 'Get-ChildItem C:\ -Force | Remove-Item -Recurse -Force'
    - 'gci / | ri -r -fo'
    tn:
    - 'Get-ChildItem .\build -Recurse | Remove-Item -Force'
    - 'Get-ChildItem $env:TEMP -Filter *.tmp | Remove-Item'
    - 'Get-ChildItem C:\Windows\System32 -Filter *.dll | Select-Object -First 5'
    - 'Get-ChildItem C:\ProgramData\MyApp -Recurse | Remove-Item -Force'
# ---------------------------------------------------------------------------
# Timestamp rewriting on system files. Bash twin:
# ts-block-touch-timestamp-manipulation (touch -t, -d or --date on a file
# under /etc, /usr, /bin, /var and the like), BLOCK. Not read: the property
# assigned directly, `(Get-Item f).LastWriteTime = …`, which is no command.
# ---------------------------------------------------------------------------
- id: ps-block-timestamp-manipulation
  taxonomy: persistence-evasion/anti-forensics/timestamp-manipulation
  match:
    powershell:
      command: set-itemproperty
      args_any: [lastwritetime, lastwritetimeutc, creationtime, creationtimeutc, lastaccesstime, lastaccesstimeutc]
      paths_any: ['?:/Windows/**', '?:/Program Files/**', '?:/Program Files (x86)/**']
  decision: BLOCK
  confidence: 0.9
  reason: >-
    Setting a Windows system file's LastWriteTime, CreationTime or
    LastAccessTime back-dates it so a planted or altered binary blends in
    with the files around it (timestomping): the PowerShell spelling of
    touch -t on a file under /usr/bin.
  tests:
    tp:
    - 'Set-ItemProperty C:\Windows\System32\x.dll -Name LastWriteTime -Value ''01/01/2020'''
    - 'Set-ItemProperty -Path "C:\Program Files\App\app.exe" -Name CreationTime -Value (Get-Date ''2019-05-01'')'
    - 'sp $env:windir\System32\drivers\x.sys LastAccessTime ''2020-01-01'''
    tn:
    - 'Set-ItemProperty .\build\out.txt -Name LastWriteTime -Value (Get-Date)'
    - 'Get-ItemProperty C:\Windows\System32\x.dll -Name LastWriteTime'
    - 'Set-ItemProperty C:\Windows\System32\x.dll -Name IsReadOnly -Value $true'
