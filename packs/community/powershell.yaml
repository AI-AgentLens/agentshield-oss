    - '.\a.exe; iwr https://dl.example/a.exe -OutFile a.exe'
    - 'iwr https://dl.example/a.exe -OutFile a.exe; .\b.exe'
    - 'iwr https://dl.example/tool.exe -OutFile tool.exe; tool --version'
    - 'iwr https://api.example/v'
