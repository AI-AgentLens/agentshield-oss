    powershell:
      command: remove-item
      params_any:
      - name: -Recurse
      args_any: ['-force', '-forc', '-for', '-fo']
      paths_any: ['?:/', '?:/\*', '?:/\*.\*', '/\*']
  decision: BLOCK
  confidence: 0.95
  reason: >-
    Remove-Item -Recurse -Force on a drive root (C:\, C:\*, $env:SystemDrive\)
    deletes everything on the drive: the PowerShell spelling of rm -rf /.
  tests:
    tp:
    - 'Remove-Item -Recurse -Force C:\'
    - 'Remove-Item C:\* -Recurse -Force'
    - 'rm -r -fo C:\'
    - 'del D:\* -Recurse -Force'
    - 'Remove-Item -LiteralPath ''C:\'' -Recurse -Force'
    - 'Remove-Item -Recurse -Force $env:SystemDrive\'
    - 'Remove-Item -Force -Recurse -Path C:\*'
    - 'Remove-Item -Recurse -Force /*'
    - 'erase -r -fo C:\*.*'
    tn:
    - 'Remove-Item -Recurse C:\'
    - 'Remove-Item -Force C:\temp\x.txt'
    - 'Remove-Item -Recurse -Force .\dist'
    - 'Remove-Item -Recurse -Force C:\temp\build'
    - 'Remove-Item -Recurse -Force C:'
    - 'Get-ChildItem C:\ -Force'
    - 'Remove-Item -Recurse -Force:$false C:\'
# A drive root written as a bare separator (`/`, `\`) is no path to the lane,
# so it is read as an argument word. That leaves one slot for a flag: -Force
# through params_any, so `-Recurse` alone (bash's AUDIT) does not fire, and the
