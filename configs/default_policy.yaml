# AgentShield Default Policy — v0.1
# Copy this to ~/.agentshield/policy.yaml

version: "0.1"

defaults:
  decision: "REQUIRE_APPROVAL"
  non_interactive: "BLOCK"
  log_redaction: true
  protected_paths:
    - "~/.ssh/**"
    - "~/.aws/**"
    - "~/.gnupg/**"
    - "~/.config/gcloud/**"
    - "~/.kube/**"
    - "/etc/**"
    - "/System/**"
    - "/Library/**"
  # A protected path handed to its designated consumer through the credential
  # slot is recorded (AUDIT, rule protected-path-consumer), not blocked:
  # ssh -i, kubectl --kubeconfig, gpg --homedir, ssh-add <key>. Every other
  # way of naming the path still BLOCKs — cat, python open(), a redirect, or
  # scp with the key as a SOURCE operand (no -i before it). Additive: you can
  # declare another consumer here, never remove a shipped one.
  #
  # `env:` is the same slot spelled as an environment variable —
  # `export KUBECONFIG=~/.kube/config` is what `kubectl --kubeconfig …` is.
  # Assigning a protected path to one of these names is RECORDED, never
  # blocked; a protected path assigned to any other variable is ignored, as
  # it always has been (an assignment reads nothing). The read itself still
  # BLOCKs: `cat $KUBECONFIG` resolves through the symbol table.
  protected_path_consumers:
    - executable: ["ssh", "scp", "sftp", "ssh-copy-id"]
      flags: ["-i", "-F"]
    - executable: ["ssh-keygen"]
      flags: ["-f"]
    - executable: ["ssh-add"]
      positional: true
    - executable: ["kubectl", "helm"]
      flags: ["--kubeconfig"]
      env: ["KUBECONFIG"]
    - executable: ["gpg", "gpg2", "gpgconf"]
      flags: ["--homedir"]
      env: ["GNUPGHOME"]
    # Cloud CLIs have no flag for the credential file — the environment is
    # the only slot, so these entries carry no flags.
    - executable: ["aws"]
      env: ["AWS_SHARED_CREDENTIALS_FILE", "AWS_CONFIG_FILE"]
    - executable: ["gcloud"]
      env: ["GOOGLE_APPLICATION_CREDENTIALS", "CLOUDSDK_CONFIG"]

network:
  allow_domains:
    - "github.com"
    - "api.github.com"
    - "pypi.org"
    - "files.pythonhosted.org"
    - "registry.npmjs.org"
    - "formulae.brew.sh"

rules:
  # === BLOCK: Never allow these ===
  - id: "block-rm-root"
    match:
      command_regex: "^(rm|sudo rm)\\s+-rf\\s+/(\\s|$)"
    decision: "BLOCK"
    reason: "Destructive remove at filesystem root is never allowed."

  - id: "block-pipe-to-shell"
    match:
      command_regex: "^(curl|wget).*(\\||\\s+\\|)\\s*(sh|bash|zsh)(\\s|$)"
    decision: "BLOCK"
    reason: "Pipe-to-shell is blocked. Download and inspect scripts first."

  # === REQUIRE_APPROVAL: Ask before running ===
  - id: "approve-package-installs"
    match:
      command_prefix:
        - "npm install"
        - "pnpm add"
        - "yarn add"
        - "pip install"
        - "poetry add"
        - "brew install"
        - "brew tap"
    decision: "REQUIRE_APPROVAL"
    reason: "Package installs can introduce supply-chain risk."

  - id: "approve-network"
    match:
      command_prefix:
        - "curl "
        - "wget "
    decision: "REQUIRE_APPROVAL"
    reason: "Network requests require approval."

  # === REQUIRE_APPROVAL: Ask before running (git / file state changes) ===
  # These used to carry decision: "SANDBOX" — a preview-in-a-temp-checkout
  # mode that ran the command in a throwaway sandbox before letting it touch
  # the real working tree. That execution path (internal/approval) was
  # removed along with the `run` subcommand after an incident where
  # AgentShield actually executed a destructive command (see CLAUDE.md);
  # AgentShield now only evaluates commands, so there is nothing left to
  # sandbox INTO. "SANDBOX" was never a real decision value after that —
  # it isn't declared in internal/policy/types.go and the engine doesn't
  # branch on it, so these two rules silently fell through to ALLOW. Asking
  # for approval is the closest real behavior to "let me look before this
  # runs" (#3298 tracks REQUIRE_APPROVAL itself still resolving to allow on
  # harnesses with no native approval channel — a separate, already-tracked
  # gap, not reintroduced here).
  - id: "approve-git-changes"
    match:
      command_prefix:
        - "git checkout"
        - "git switch"
        - "git reset"
        - "git rebase"
        - "git merge"
    decision: "REQUIRE_APPROVAL"
    reason: "Git state changes require approval before running."

  - id: "approve-file-edits"
    match:
      command_prefix:
        - "sed "
        - "perl -pi"
        - "python -c"
    decision: "REQUIRE_APPROVAL"
    reason: "In-place edits require approval so you can review them first."

  # === ALLOW: Safe read-only commands ===
  - id: "allow-readonly"
    match:
      command_prefix:
        - "ls"
        - "pwd"
        - "whoami"
        - "cat "
        - "head "
        - "tail "
        - "grep "
        - "find "
        - "which "
        - "echo "
        - "git status"
        - "git diff"
        - "git log"
        - "git branch"
    decision: "ALLOW"
    reason: "Read-only commands are safe."
